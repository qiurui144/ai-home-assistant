name: release

# Multi-arch Docker image push to GHCR on tag push.
# All `${{ github.* }}` usages are non-user-controlled (ref_name set
# by GitHub Actions infra, not by external input) and routed via env:
# into the build matrix — no shell interpolation of untrusted strings.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VER="${REF_NAME#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build + push (3 arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/riscv64
          push: true
          tags: |
            ghcr.io/qiurui144/ai-home-assistant:${{ steps.meta.outputs.version }}
            ghcr.io/qiurui144/ai-home-assistant:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
