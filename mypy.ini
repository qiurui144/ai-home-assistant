[mypy]
python_version = 3.11
strict = True
warn_unused_configs = True
warn_unreachable = True
# tests/ is intentionally NOT excluded — strict mode applies to test code too.
# tests/soak/ excluded because the soak runner uses asyncio + subprocess in
# patterns mypy cannot easily verify.
exclude = ^(tests/soak/|docs/|build/)

[mypy-aiosqlite.*]
ignore_missing_imports = True
[mypy-tomli.*]
ignore_missing_imports = True
